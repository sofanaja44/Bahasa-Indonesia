name: Situs

# Membangun editor web (web/) dan menerbitkannya ke GitHub Pages setiap kali main berubah.
# Sekali saja sebelumnya: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    name: Bangun editor web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bangun situs
        run: python web/bangun.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/situs

  terbitkan:
    name: Terbitkan ke GitHub Pages
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - id: terbit
        uses: actions/deploy-pages@v4
