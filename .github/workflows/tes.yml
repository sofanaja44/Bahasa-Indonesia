name: Tes

on:
  push:
  pull_request:

jobs:
  tes:
    name: Python ${{ matrix.python }} di ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pasang dependensi
        run: python -m pip install -r requirements.txt
      - name: Jalankan tes
        run: python -m pytest tests/ -q
        env:
          PYTHONIOENCODING: utf-8

  mesin:
    name: Mesin Go di ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pasang dependensi Python
        run: python -m pip install -r requirements.txt
      - name: Periksa format dan go vet
        working-directory: mesin
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; echo "::error::Rapikan dulu dengan: gofmt -w ."; exit 1; fi
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
      - name: Tes Go (termasuk korpus pembanding)
        working-directory: mesin
        run: go test ./...
      - name: Bangun perintah indonesia
        working-directory: mesin
        run: go build -trimpath -o bin/ ./cmd/indonesia
      - name: Tes kesesuaian dan CLI dengan mesin Go
        shell: bash
        run: |
          aplikasi="mesin/bin/indonesia$(cd mesin && go env GOEXE)"
          "$aplikasi" versi
          MESIN_INDONESIA="$aplikasi" python -m pytest tests/test_kesesuaian.py tests/test_cli.py -q
        env:
          PYTHONIOENCODING: utf-8
      - name: Korpus pembanding masih sesuai dengan interpreter Python
        if: runner.os == 'Linux'
        run: python mesin/testdata/buat_korpus.py --periksa

  web:
    name: Editor web (WebAssembly + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bangun situs
        run: python web/bangun.py
      - name: Pasang Playwright dan Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Tes kesesuaian dan korpus di mesin WebAssembly
        run: node web/tes/tes_mesin.mjs
      - name: Tes editor di Chromium
        run: node --test --test-concurrency=1 --test-reporter=spec web/tes/tes_editor.mjs

  vscode:
    name: Ekstensi VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Pasang dependensi
        working-directory: vscode
        run: npm ci
      - name: Tes pewarnaan kode
        working-directory: vscode
        run: node --test --test-reporter=spec tes/tes_grammar.mjs
      - name: Kemas ekstensi
        working-directory: vscode
        run: npx vsce package --out bahasa-indonesia.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: bahasa-indonesia.vsix
          path: vscode/bahasa-indonesia.vsix
