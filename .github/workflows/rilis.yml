name: Rilis

# Membangun perintah 'indonesia' (mesin Go, satu berkas tanpa perlu memasang apa pun) untuk
# Windows, macOS, dan Linux, lalu mengujinya dengan semua tes kesesuaian dan tes CLI.
# Ekstensi VS Code (.vsix) ikut dikemas.
#
# Untuk rilis baru: samakan Versi di mesin/api.go, lalu dorong tag-nya, mis.
#     git tag v0.4.0 && git push origin v0.4.0
# Aplikasinya lalu terbit di halaman Releases. Pada pull request (atau "Run workflow"),
# aplikasinya hanya dibuat dan diuji, dan bisa diunduh dari halaman run di tab Actions.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "mesin/**"
      - "tes_kesesuaian/**"
      - "tests/test_kesesuaian.py"
      - "tests/test_cli.py"
      - "vscode/**"
      - ".github/workflows/rilis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplikasi:
    name: Aplikasi ${{ matrix.nama }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # uji: aplikasinya dijalankan dengan semua tes di sistem itu sendiri
          - { os: windows-latest, nama: Windows (x64), goos: windows, goarch: amd64, berkas: indonesia-windows-x64.exe, uji: true }
          - { os: macos-latest, nama: macOS (Apple Silicon), goos: darwin, goarch: arm64, berkas: indonesia-macos-arm64, uji: true }
          - { os: ubuntu-latest, nama: Linux (x64), goos: linux, goarch: amd64, berkas: indonesia-linux-x64, uji: true }
          # Dibangun silang (Go tidak butuh sistem tujuannya), tanpa dijalankan
          - { os: ubuntu-latest, nama: Windows (ARM), goos: windows, goarch: arm64, berkas: indonesia-windows-arm64.exe, uji: false }
          - { os: ubuntu-latest, nama: macOS (Intel), goos: darwin, goarch: amd64, berkas: indonesia-macos-x64, uji: false }
          - { os: ubuntu-latest, nama: Linux (ARM), goos: linux, goarch: arm64, berkas: indonesia-linux-arm64, uji: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Periksa nomor versi
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          versi=$(sed -n 's/^const Versi = "\(.*\)"/\1/p' mesin/api.go)
          if [ "v$versi" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan Versi = \"$versi\" di mesin/api.go"
            exit 1
          fi
      - name: Bangun aplikasi
        working-directory: mesin
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "../dist/${{ matrix.berkas }}" ./cmd/indonesia
      - uses: actions/setup-python@v5
        if: matrix.uji
        with:
          python-version: "3.13"
      - name: Uji aplikasinya dengan tes kesesuaian dan tes CLI
        if: matrix.uji
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          "dist/${{ matrix.berkas }}" versi
          MESIN_INDONESIA="dist/${{ matrix.berkas }}" python -m pytest tests/test_kesesuaian.py tests/test_cli.py -q
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.berkas }}
          path: dist/${{ matrix.berkas }}
          if-no-files-found: error

  ekstensi:
    name: Ekstensi VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kemas ekstensi
        working-directory: vscode
        run: |
          npm ci
          node --test tes/tes_grammar.mjs
          npx vsce package --out bahasa-indonesia.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: bahasa-indonesia.vsix
          path: vscode/bahasa-indonesia.vsix
          if-no-files-found: error

  terbitkan:
    name: Terbitkan di halaman Releases
    needs: [aplikasi, ekstensi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Buat rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Bahasa Indonesia $GITHUB_REF_NAME"
          --generate-notes
