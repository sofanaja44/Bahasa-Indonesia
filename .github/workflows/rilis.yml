name: Rilis

# Membungkus interpreter menjadi aplikasi satu berkas untuk Windows, macOS, dan Linux
# (PyInstaller), lalu mengujinya dengan semua tes kesesuaian.
#
# Untuk rilis baru: samakan VERSI di indonesia.py, lalu dorong tag-nya, mis.
#     git tag v0.4.0 && git push origin v0.4.0
# Aplikasinya lalu terbit di halaman Releases. Pada pull request (atau "Run workflow"),
# aplikasinya hanya dibuat dan diuji, dan bisa diunduh dari halaman run di tab Actions.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "indonesia.py"
      - "src/**"
      - "tes_kesesuaian/**"
      - "tests/test_kesesuaian.py"
      - "requirements.txt"
      - ".github/workflows/rilis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplikasi:
    name: Aplikasi ${{ matrix.nama }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nama: Windows, berkas: indonesia-windows.exe }
          - { os: macos-latest, nama: macOS, berkas: indonesia-macos }
          # Ubuntu 22.04 (glibc 2.35), agar aplikasinya juga jalan di distro Linux yang lebih lama
          - { os: ubuntu-22.04, nama: Linux, berkas: indonesia-linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Periksa nomor versi
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          versi=$(python -c "import re; print(re.search(r'^VERSI = \"(.+)\"', open('indonesia.py', encoding='utf-8').read(), re.M).group(1))")
          if [ "v$versi" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan VERSI = \"$versi\" di indonesia.py"
            exit 1
          fi
      - name: Pasang PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pillow
      - name: Bungkus interpreter menjadi satu berkas
        run: pyinstaller --onefile --name indonesia --icon web/ikon-512.png --clean --noconfirm indonesia.py
      - name: Uji aplikasinya dengan tes kesesuaian
        shell: bash
        run: |
          mv dist/indonesia* "dist/${{ matrix.berkas }}"
          "dist/${{ matrix.berkas }}" versi
          MESIN_INDONESIA="dist/${{ matrix.berkas }}" python -m pytest tests/test_kesesuaian.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.berkas }}
          path: dist/${{ matrix.berkas }}
          if-no-files-found: error

  terbitkan:
    name: Terbitkan di halaman Releases
    needs: aplikasi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Buat rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Bahasa Indonesia $GITHUB_REF_NAME"
          --generate-notes
